# GO-LIVE drop-in for wallex-arena.service. Install ONLY after the go-live checklist in docs/DEPLOYMENT.md.
#   sudo install -D -m 0644 wallex-arena.live.conf /etc/systemd/system/wallex-arena.service.d/live.conf
# Also required: an account in the arena config with "live": true and
#   "wallex_env_file": "/run/credentials/wallex-arena.service/wallex"
# Kill switch at any time: sudo touch /var/lib/wallex-arena/LIVE_DISABLED
[Service]
LoadCredential=wallex:@@SECRETS_DIR@@/wallex.env
Environment=WALLEX_LIVE_ENABLED=1

name: Bug report
description: Something behaves differently from what the docs or UI promise.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open https://<app>.liara.run/...\n2. ...\n3. See error"
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Release / commit
      description: Shown by /healthz or /api/health, or the Liara release tag (vN).
  - type: input
    id: request_id
    attributes:
      label: Request ID (X-Request-ID header or error page)
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines (redact tokens, keys and personal data)
      render: text
